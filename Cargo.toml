[package]
name = "Reclaimer"
version = "0.1.0"
edition = "2024"

[package.metadata.bundle]
name = "Reclaimer"
identifier = "com.dincertekin.reclaimer"
icon = ["icons/icon.png"]

[dependencies]
eframe = { version = "0.34.3", features = ["persistence"] }
egui  = "0.34.3"
rfd   = "0.15"
open  = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc  = "0.2"
plist = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[dev-dependencies]
egui_kittest = { version = "0.34.3", features = ["eframe", "wgpu", "snapshot"] }
