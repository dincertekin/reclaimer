<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Reclaimer</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="app">
            <div class="titlebar">
                <div class="logo">
                    <svg
                        width="16"
                        height="16"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="white"
                        stroke-width="2"
                    >
                        <circle cx="10" cy="10" r="6" />
                        <line x1="14.5" y1="14.5" x2="20" y2="20" />
                    </svg>
                </div>
                <h1>Reclaimer</h1>
            </div>

            <div class="panel">
                <div class="toolbar">
                    <div class="path-box">
                        <span id="image-path-display">No image selected</span>
                    </div>
                    <button class="btn" id="open-btn">Open</button>
                    <button class="btn btn-primary" id="scan-btn" disabled>
                        Scan
                    </button>
                </div>

                <div
                    class="progress-track"
                    id="progress-track"
                    style="display: none"
                >
                    <div
                        class="progress-fill"
                        id="progress-fill"
                        style="width: 0%"
                    ></div>
                </div>

                <div class="stats">
                    <div class="stat">
                        <div class="stat-label">Sectors scanned</div>
                        <div class="stat-value" id="stat-sectors">0</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Files found</div>
                        <div class="stat-value gold" id="stat-found">0</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Recovered</div>
                        <div class="stat-value" id="stat-recovered">0</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Total size</div>
                        <div class="stat-value" id="stat-size">0 KB</div>
                    </div>
                </div>

                <div class="content">
                    <div class="results" id="results-list">
                        <div class="empty-state">
                            Open a disk image and click Scan to begin.
                        </div>
                    </div>

                    <div class="detail" id="detail-panel">
                        <h3>Details</h3>
                        <div class="empty-state">
                            Select a file to see details.
                        </div>
                    </div>
                </div>
            </div>

            <div class="statusbar" id="statusbar">Ready.</div>
        </div>

        <script src="app.js"></script>
    </body>
</html>
